  observed_at: GET https://api.laminalabs.ai/mcp/<unknown>, DELETE https://api.laminalabs.ai/mcp
jsonrpc_errors:
- code: -32601
  message: 'Unsupported MCP method: <method>'
  cause: The MCP server implements tools only; resources/* and prompts/* are not supported.
  transport: JSON-RPC over the /mcp endpoint
notes:
- This catalog is derived from live probes of unauthenticated and malformed requests, not
  from a published error reference; Lamina publishes no error-code documentation.
- The envelope is consistent across HTTP status codes, which makes client-side error
  handling straightforward, but it is not RFC 9457 application/problem+json.
- Unsupported HTTP methods collapse to NOT_FOUND instead of 405 Method Not Allowed.
