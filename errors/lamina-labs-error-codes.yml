  example_details:
    formErrors: []
    fieldErrors:
      response_type: ['Invalid input: expected "code"']
      client_id: ['Invalid input: expected string, received undefined']
- code: NOT_FOUND
  status: 404
  message: Not found
  cause: Unknown path, or an unsupported method on a known path.
  remediation: Check the path; note that unsupported methods also return NOT_FOUND rather
