    exposes tools only.
authorization:
  model: oauth2
  discovery:
  - https://api.laminalabs.ai/.well-known/oauth-authorization-server
  - https://api.laminalabs.ai/.well-known/openid-configuration
  authorization_endpoint: https://api.laminalabs.ai/oauth/authorize
  token_endpoint: https://api.laminalabs.ai/oauth/token
