  note: tools/list and initialize answer unauthenticated; tool invocation requires a bearer token.
tools:
- name: simi_submit_video
  title: Submit Simi Video
  description: Submit a Simi video generation job. This returns immediately with job metadata; it does
    not stream progress.
  scope: jobs:create
  input:
    required:
    - prompt
    properties:
      prompt:
        type: string
        minLength: 1
        maxLength: 10000
        description: The user-facing video prompt.
      duration_seconds:
        type: integer
        minimum: 1
        maximum: 300
        default: 60
        description: Requested video duration in seconds.
      aspect_ratio:
        type: string
        default: '16:9'
        description: Video aspect ratio, for example 16:9, 9:16, or 1:1.
      language:
        type: string
        default: English
        description: Output language for the generated video.
  output:
    required:
    - job
    properties:
      job:
        type: object
        description: Public Lamina job metadata.
  annotations:
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
- name: simi_get_video
  title: Get Simi Video
  description: Check a Simi video job and return playback/download URLs when the video is ready.
  scope: jobs:read
  input:
    required:
    - job_id
    properties:
      job_id:
        type: string
        minLength: 1
        description: The Lamina job id returned by simi_submit_video.
  output:
    required:
    - job
    - playback
    - app_url
    - ready
    properties:
      job:
        type: object
        description: Public Lamina job metadata.
      playback:
        type: object
        description: Playback status and signed media URLs.
      app_url:
        type: string
      video_url:
        type:
        - string
        - 'null'
      download_url:
        type:
        - string
        - 'null'
      ready:
        type: boolean
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
