  title: Lamina Simi MCP Server
  version: 0.1.0
  transport: http
  url: https://api.laminalabs.ai/mcp
  protocol_version: '2025-06-18'
  instructions: Use simi_submit_video to submit a Simi video generation job. Then call simi_get_video
