aid: lamina-labs
name: Lamina Labs
description: 'Lamina Labs is a San Francisco company (Y Combinator Spring 2026) building
  near-real-time video infrastructure for large language models. Its flagship product,
  Simi, turns prompts, documents, and AI-generated answers into whiteboard-style teaching
  videos in seconds, handling script writing, illustration, animation, and narration
  automatically, for durations from one minute to an hour and in over 80 languages.
  The company targets training, onboarding, product walkthroughs, sales, marketing,
  and educational use cases, with the stated goal of making video the default interface
  for AI communication. Lamina exposes Simi to agents through a public remote MCP server
  at https://api.laminalabs.ai/mcp, secured by an OAuth 2.1-style authorization server
  with PKCE, dynamic client registration, and job-scoped access tokens.'
