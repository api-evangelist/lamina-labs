apis:
- aid: lamina-labs:simi
  name: Simi Video Generation API
  description: 'The Simi API submits and retrieves whiteboard-style explainer video
    generation jobs. Submission is asynchronous: a job is created and returns immediately
    with job metadata, then the job is polled until playback and download URLs are
    available. The surface is published to agents as a remote Model Context Protocol
    server, authorized by OAuth with the jobs:create and jobs:read scopes.'
